<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="300" fill="#FCFCFB"/>
  <g>
    <!-- boxes -->
    <g>
      <rect x="40"  y="90" width="196" height="120" fill="#fff" stroke="#E7E4E0" stroke-width="1.5"/>
      <rect x="40"  y="90" width="196" height="4" fill="#B5664B"/>
      <rect x="288" y="90" width="196" height="120" fill="#fff" stroke="#E7E4E0" stroke-width="1.5"/>
      <rect x="288" y="90" width="196" height="4" fill="#B5664B"/>
      <rect x="536" y="90" width="196" height="120" fill="#fff" stroke="#E7E4E0" stroke-width="1.5"/>
      <rect x="536" y="90" width="196" height="4" fill="#B5664B"/>
      <rect x="784" y="90" width="196" height="120" fill="#fff" stroke="#E7E4E0" stroke-width="1.5"/>
      <rect x="784" y="90" width="196" height="4" fill="#B5664B"/>
      <rect x="1032" y="90" width="128" height="120" fill="#fff" stroke="#E7E4E0" stroke-width="1.5"/>
      <rect x="1032" y="90" width="128" height="4" fill="#B5664B"/>
    </g>

    <!-- arrows -->
    <g stroke="#B5664B" stroke-width="2" fill="#B5664B">
      <line x1="240" y1="150" x2="282" y2="150"/><path d="M282 150 l-9 -5 v10 Z"/>
      <line x1="488" y1="150" x2="530" y2="150"/><path d="M530 150 l-9 -5 v10 Z"/>
      <line x1="736" y1="150" x2="778" y2="150"/><path d="M778 150 l-9 -5 v10 Z"/>
      <line x1="984" y1="150" x2="1026" y2="150"/><path d="M1026 150 l-9 -5 v10 Z"/>
    </g>

    <!-- step numbers + titles + subs -->
    <g font-weight="700" fill="#14171A" font-family="Archivo, sans-serif" font-size="19">
      <text x="60"  y="132">Detect</text>
      <text x="308" y="132">Classify</text>
      <text x="556" y="132">Localize</text>
      <text x="804" y="132">Navigate</text>
      <text x="1052" y="132">Engage</text>
    </g>
    <g fill="#6E7680" font-size="12.5">
      <text x="60"  y="158">Passive acoustics</text>
      <text x="60"  y="176">+ forward camera</text>
      <text x="308" y="158">Propeller acoustic</text>
      <text x="308" y="176">signature match</text>
      <text x="556" y="158">4-hydrophone TDOA</text>
      <text x="556" y="176">bearing &amp; range</text>
      <text x="804" y="158">IMU dead-reckoning</text>
      <text x="804" y="176">+ vision tracking</text>
      <text x="1052" y="158">Approach</text>
      <text x="1052" y="176">target</text>
    </g>
  </g>
  <text x="40" y="250" fill="#6E7680" font-size="12.5">Onboard on a Jetson Orin Nano (inference) and Teensy 4.1 (real-time control); loss of signal or sensor fault blows ballast and surfaces as failsafe.</text>
</svg>
