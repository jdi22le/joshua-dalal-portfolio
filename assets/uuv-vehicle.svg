<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="540" fill="#FCFCFB"/>

  <!-- ===== minimal line vehicle ===== -->
  <g fill="none" stroke="#3a4046" stroke-width="1.7" stroke-linejoin="round">
    <!-- body capsule -->
    <rect x="300" y="172" width="452" height="78" rx="39"/>
    <!-- tail cone -->
    <path d="M742 176 L812 198 L812 224 L742 246"/>
    <!-- ducted prop -->
    <circle cx="846" cy="211" r="25"/>
    <!-- top fin -->
    <path d="M694 172 L742 172 L720 143 Z"/>
    <!-- bottom fin -->
    <path d="M694 250 L742 250 L720 279 Z"/>
    <!-- belly pod + pivot thruster -->
    <path d="M352 250 h44 v13 h-44 Z"/>
    <circle cx="374" cy="284" r="11"/>
    <!-- ballast (internal, dashed) -->
    <rect x="432" y="186" width="150" height="50" rx="6" stroke="#B5664B" stroke-dasharray="5 4"/>
    <line x1="446" y1="211" x2="568" y2="211" stroke="#8a9297"/>
    <!-- compute (internal) -->
    <rect x="642" y="190" width="28" height="42" rx="4"/>
  </g>
  <!-- ballast rod ticks -->
  <g stroke="#8a9297" stroke-width="1.4">
    <line x1="452" y1="206" x2="452" y2="216"/><line x1="462" y1="206" x2="462" y2="216"/>
    <line x1="472" y1="206" x2="472" y2="216"/><line x1="482" y1="206" x2="482" y2="216"/>
  </g>
  <!-- camera + hub + hydrophones -->
  <circle cx="318" cy="211" r="8" fill="#2b3236"/>
  <circle cx="846" cy="211" r="6" fill="#B5664B"/>
  <circle cx="374" cy="284" r="3.5" fill="#B5664B"/>
  <g stroke="#3a4046" stroke-width="1.7"><line x1="486" y1="172" x2="486" y2="163"/><line x1="524" y1="172" x2="524" y2="163"/><line x1="562" y1="172" x2="562" y2="163"/><line x1="600" y1="172" x2="600" y2="163"/></g>

  <!-- ===== number badges (on components, no leaders) ===== -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <g><circle cx="318" cy="140" r="11" fill="#B5664B"/><text x="318" y="144.5" fill="#fff">1</text></g>
    <g><circle cx="543" cy="140" r="11" fill="#B5664B"/><text x="543" y="144.5" fill="#fff">2</text></g>
    <g><circle cx="470" cy="211" r="11" fill="#B5664B"/><text x="470" y="215.5" fill="#fff">3</text></g>
    <g><circle cx="656" cy="140" r="11" fill="#B5664B"/><text x="656" y="144.5" fill="#fff">4</text></g>
    <g><circle cx="720" cy="118" r="11" fill="#B5664B"/><text x="720" y="122.5" fill="#fff">5</text></g>
    <g><circle cx="846" cy="140" r="11" fill="#B5664B"/><text x="846" y="144.5" fill="#fff">6</text></g>
    <g><circle cx="374" cy="316" r="11" fill="#B5664B"/><text x="374" y="320.5" fill="#fff">7</text></g>
  </g>
  <!-- short ticks from badge toward its component -->
  <g stroke="#B5664B" stroke-width="1.2">
    <line x1="318" y1="151" x2="318" y2="201"/>
    <line x1="543" y1="151" x2="543" y2="165"/>
    <line x1="656" y1="151" x2="656" y2="190"/>
    <line x1="720" y1="129" x2="720" y2="150"/>
    <line x1="846" y1="151" x2="846" y2="188"/>
    <line x1="374" y1="305" x2="374" y2="295"/>
  </g>

  <!-- ===== legend ===== -->
  <g>
    <line x1="120" y1="372" x2="1080" y2="372" stroke="#E7E4E0" stroke-width="1"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#fff">
    <g><circle cx="130" cy="404" r="10" fill="#B5664B"/><text x="130" y="408.5">1</text></g>
    <g><circle cx="130" cy="444" r="10" fill="#B5664B"/><text x="130" y="448.5">2</text></g>
    <g><circle cx="130" cy="484" r="10" fill="#B5664B"/><text x="130" y="488.5">3</text></g>
    <g><circle cx="640" cy="404" r="10" fill="#B5664B"/><text x="640" y="408.5">4</text></g>
    <g><circle cx="640" cy="444" r="10" fill="#B5664B"/><text x="640" y="448.5">5</text></g>
    <g><circle cx="640" cy="484" r="10" fill="#B5664B"/><text x="640" y="488.5">6</text></g>
    <g><circle cx="640" cy="524" r="10" fill="#B5664B"/><text x="640" y="528.5">7</text></g>
  </g>
  <g fill="#14171A" font-size="15" font-weight="600">
    <text x="152" y="400">Forward camera</text>
    <text x="152" y="440">4&#215; hydrophone array</text>
    <text x="152" y="480">Ballast tank</text>
    <text x="662" y="400">Onboard compute</text>
    <text x="662" y="440">Servo-actuated fins</text>
    <text x="662" y="480">T200 main thruster</text>
    <text x="662" y="520">Pivoting front thruster</text>
  </g>
  <g fill="#6E7680" font-size="12.5">
    <text x="152" y="416">OpenCV vision tracking</text>
    <text x="152" y="456">TDOA bearing &amp; range</text>
    <text x="152" y="496">threaded-rod depth control</text>
    <text x="662" y="416">Jetson Orin Nano + Teensy 4.1</text>
    <text x="662" y="456">horizontal-plane steering</text>
    <text x="662" y="496">ducted, low-speed cruise</text>
    <text x="662" y="536">vectored low-speed control</text>
  </g>
</svg>
